<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2544" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SR Database" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" href="/static/icon.ico" sizes="any" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png" />
  <title>Sign In — SR Database Server</title>
  <link rel="stylesheet" href="/static/style.css?v=4.5" />
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 20px;
      background: linear-gradient(135deg, #0b1b34 0%, #0f2544 55%, #163766 100%);
    }
    .auth-card {
      width: 100%; max-width: 400px; background: #ffffff;
      border-radius: 12px; padding: 28px 28px 24px;
      box-shadow: 0 20px 45px rgba(2, 6, 23, 0.45);
      border: 1px solid #cbd5e1;
    }
    .auth-brand { text-align: center; margin-bottom: 20px; }
    .auth-icon {
      width: 46px; height: 46px; border-radius: 10px;
      background: #0f2544; color: #38bdf8;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 10px;
    }
    .auth-brand h1 { margin: 0; font-size: 20px; color: #0f2544; }
    .auth-brand p { margin: 4px 0 0; font-size: 12px; color: #64748b; }
    .auth-card .field { margin-bottom: 12px; }
    .auth-card .field input { padding: 9px 11px; font-size: 13.5px; }
    .remember-row {
      display: flex; align-items: center; gap: 7px;
      font-size: 12.5px; color: #334155; margin: 4px 0 14px;
      cursor: pointer;
    }
    .auth-btn { width: 100%; justify-content: center; padding: 10px 14px; font-size: 14px; }
    .auth-footer { margin-top: 16px; font-size: 11.5px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1>SR Database Server</h1>
      <p>Sucker Rod &amp; Downhole Equipment</p>
    </div>

    {% if msg %}<div class="alert">{{ msg }}</div>{% endif %}
    {% if err %}<div class="alert-err">{{ err }}</div>{% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next_url }}" />
      <div class="field">
        <label>Username</label>
        <input name="username" required autofocus autocomplete="username" placeholder="Enter your username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required autocomplete="current-password" placeholder="Enter your password" />
      </div>
      <label class="remember-row">
        <input type="checkbox" name="remember" value="1" />
        <span>Keep me signed in on this browser (30 days)</span>
      </label>
      <button type="submit" class="btn auth-btn">Sign In</button>
    </form>

    <div class="auth-footer">
      Authorized personnel only. Contact your Administrator for access.
    </div>
  </div>
</body>
</html>
